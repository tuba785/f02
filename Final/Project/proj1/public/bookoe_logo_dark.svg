<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon background -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a5af9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4b3bd1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square icon -->
  <rect x="40" y="40" rx="24" ry="24" width="140" height="140" fill="url(#grad)"/>

  <!-- Books icon -->
  <g fill="white">
    <rect x="80" y="80" width="12" height="60" rx="2"/>
    <rect x="98" y="70" width="12" height="70" rx="2"/>
    <rect x="116" y="90" width="12" height="50" rx="2" transform="rotate(-10 122 115)"/>
    <rect x="70" y="140" width="80" height="8" rx="4"/>
  </g>

  <!-- Text -->
  <text x="210" y="110" font-family="Arial, Helvetica, sans-serif" font-size="56" fill="#e5e7eb" font-weight="700">
    Bookoe
  </text>
  <text x="212" y="150" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9ca3af">
    Book Store Website
  </text>
</svg>
